<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ألوان دهان الجدران لكل مكان في البيت — ليش تختاره، ووين بالضبط تستخدمه.">
<meta name="theme-color" content="#F6F4F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>ألوان البيت</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --plaster:#F6F4F0;
  --card:#FFFFFF;
  --ink:#191714;
  --ink-2:#6B655C;
  --ink-3:#9C958A;
  --line:#E4DFD6;
  --line-2:#D3CCC0;
  --shadow:0 1px 2px rgba(25,23,20,.05), 0 10px 26px -18px rgba(25,23,20,.35);
  --radius:14px;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --plaster:#141310;
    --card:#1D1B17;
    --ink:#F2EFE9;
    --ink-2:#A19A8F;
    --ink-3:#7B746A;
    --line:#2B2823;
    --line-2:#3A362F;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 26px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --plaster:#141310;
  --card:#1D1B17;
  --ink:#F2EFE9;
  --ink-2:#A19A8F;
  --ink-3:#7B746A;
  --line:#2B2823;
  --line-2:#3A362F;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 26px -18px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
html{direction:rtl}
body{
  margin:0;
  background:var(--plaster);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:15px;
  line-height:1.65;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.3;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

/* ── الهيكل ── */
header.app{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
  background:color-mix(in srgb, var(--plaster) 88%, transparent);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.headwrap{max-width:780px;margin:0 auto;padding:12px 16px 0}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:20px;letter-spacing:-.02em}
.brand span{font-size:11.5px;color:var(--ink-3);letter-spacing:.06em}
nav.tabs{display:flex;gap:22px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  padding:9px 0 11px;font-size:14.5px;color:var(--ink-3);
  border-bottom:2px solid transparent;white-space:nowrap;font-family:var(--f-display);
}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
main{max-width:780px;margin:0 auto;padding:18px 16px 60px}
.lede{color:var(--ink-2);font-size:14.5px;margin-bottom:20px;max-width:56ch;line-height:1.7}

/* ── شبكة الغرف ── */
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:13px}
.roomtile{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;text-align:right;display:flex;flex-direction:column;
  transition:border-color .15s ease, transform .15s ease;
}
.roomtile:hover{border-color:var(--line-2)}
.roomtile:active{transform:scale(.985)}
.roomtile .scene{height:112px}
.roomtile .meta{padding:11px 13px 13px;display:flex;flex-direction:column;gap:3px}
.roomtile .meta strong{font-family:var(--f-display);font-weight:500;font-size:16px;letter-spacing:-.015em}
.roomtile .meta small{color:var(--ink-2);font-size:12px;display:flex;align-items:center;gap:6px}
.roomtile .meta small i{width:9px;height:9px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.12)}
.roomtile .swatches{display:flex;gap:3px;margin-top:5px}
.roomtile .swatches i{height:5px;flex:1;border-radius:2px}

/* ── صفوف الألوان ── */
.rows{display:flex;flex-direction:column}
.row{
  display:flex;gap:13px;align-items:center;text-align:right;width:100%;
  padding:11px 0;border-bottom:1px solid var(--line);
}
.rows .row:last-child{border-bottom:0}
.chip{width:66px;height:66px;border-radius:12px;flex:none;position:relative;border:1px solid rgba(0,0,0,.09)}
.chip .code{position:absolute;bottom:4px;left:6px;font-size:9px;font-family:var(--f-mono);opacity:.8;letter-spacing:-.02em}
.row .txt{min-width:0}
.row .txt strong{display:block;font-family:var(--f-display);font-weight:500;font-size:16px;letter-spacing:-.015em}
.row .txt p{color:var(--ink-2);font-size:13px;line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .txt em{font-style:normal;color:var(--ink-3);font-size:11px}
.tick{margin-inline-start:auto;flex:none;font-size:11px;color:var(--ink-3)}

/* ── أدوات التصفية ── */
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{
  border:1px solid var(--line-2);border-radius:999px;padding:5px 13px;font-size:12.5px;
  color:var(--ink-2);white-space:nowrap;
}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--plaster)}
.search{
  width:100%;background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:11px 14px;font-size:15px;margin-bottom:12px;
}
.search::placeholder{color:var(--ink-3)}

/* ── البطاقات ── */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.panel h3{font-size:14px;margin-bottom:9px}
.info{display:flex;flex-direction:column;gap:13px}
.info div strong{display:block;font-family:var(--f-display);font-weight:500;font-size:13.5px;margin-bottom:2px}
.info div p{color:var(--ink-2);font-size:13.5px}
.count{color:var(--ink-3);font-size:12px;margin:18px 0 4px;letter-spacing:.02em}

/* ── معاينة الغرفة ── */
.scene{position:relative;overflow:hidden}
.scene .wall{position:absolute;inset:0}
.scene .daylight{position:absolute;inset:0;background:linear-gradient(145deg,rgba(255,255,255,.24),transparent 52%,rgba(0,0,0,.16))}
.scene .floor{position:absolute;inset:auto 0 0 0;height:26%;background:linear-gradient(#B3906A,#8A6A4B)}
.scene .skirt{position:absolute;inset:auto 0 26% 0;height:4px;background:#F4F0E8;opacity:.9}
.scene .bulb{position:absolute;inset:0;mix-blend-mode:multiply;pointer-events:none;transition:background .25s ease}
.scene .dim{position:absolute;inset:0;pointer-events:none;transition:background .25s ease}
.preview{height:210px;border-radius:var(--radius);border:1px solid var(--line)}
.f{position:absolute;border-radius:9px}
.lightbar{display:flex;gap:6px;margin-top:10px}
.lightbar button{
  flex:1;border:1px solid var(--line-2);border-radius:9px;padding:7px 4px;font-size:12px;color:var(--ink-2);
}
.lightbar button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--plaster)}

/* ── شاشة اللون ── */
.sheet{position:fixed;inset:0;z-index:60;background:var(--plaster);overflow-y:auto;display:none}
.sheet[data-open="true"]{display:block}
.sheetbar{
  position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;
  background:color-mix(in srgb, var(--plaster) 90%, transparent);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.sheetbar strong{font-family:var(--f-display);font-weight:500;font-size:15px}
.sheetbar .x{font-size:20px;line-height:1;color:var(--ink-2);padding:4px 6px}
.sheetbody{max-width:780px;margin:0 auto;padding:16px 16px 70px}
.bigname{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:16px 0 4px}
.bigname h2{font-size:27px}
.sub{color:var(--ink-3);font-size:12.5px;margin-bottom:16px}
.pairs{display:flex;gap:12px}
.pairs div{text-align:center}
.pairs i{display:block;width:40px;height:40px;border-radius:50%;border:1px solid rgba(0,0,0,.1)}
.pairs small{font-size:9px;color:var(--ink-3);font-family:var(--f-mono)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{border:1px solid var(--line-2);border-radius:999px;padding:3px 11px;font-size:12px;color:var(--ink-2)}
.actions{display:flex;gap:9px;margin-top:4px}
.btn{
  flex:1;border-radius:11px;padding:13px;text-align:center;font-family:var(--f-display);font-size:14px;
  border:1px solid var(--ink);background:var(--ink);color:var(--plaster);
}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn.on{background:transparent;color:var(--ink);border-color:var(--ink)}

/* ── الأدوات ── */
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow label{font-size:14px}
.stepper{display:flex;align-items:center;gap:2px;border:1px solid var(--line-2);border-radius:9px;overflow:hidden}
.stepper button{width:34px;height:32px;font-size:16px;color:var(--ink-2)}
.stepper button:hover{background:var(--line)}
.stepper output{min-width:46px;text-align:center;font-family:var(--f-mono);font-size:13px}
.num{width:84px;text-align:left;background:var(--plaster);border:1px solid var(--line-2);border-radius:9px;padding:7px 10px;font-family:var(--f-mono);font-size:13px}
.res{display:flex;justify-content:space-between;padding:7px 0;font-size:14px}
.res span:last-child{font-variant-numeric:tabular-nums;color:var(--ink-2)}
.res.big{border-top:1px solid var(--line);margin-top:6px;padding-top:12px}
.res.big span:last-child{font-size:21px;color:var(--ink);font-family:var(--f-display)}
.note{color:var(--ink-3);font-size:12.5px;line-height:1.6}
.toolcard{display:block;width:100%;text-align:right}
.toolcard strong{font-family:var(--f-display);font-weight:500;font-size:15px;display:block}
.toolcard p{color:var(--ink-2);font-size:13px}
canvas{max-width:100%;border-radius:var(--radius);display:block;cursor:crosshair}
.filebtn{display:block;width:100%;border:1px dashed var(--line-2);border-radius:var(--radius);padding:22px;text-align:center;color:var(--ink-2);font-size:14px}
.guide h3{margin-top:4px}
.guide .item{padding:11px 0;border-bottom:1px solid var(--line)}
.guide .item:last-child{border-bottom:0}
.guide .item strong{display:block;font-family:var(--f-display);font-weight:500;font-size:13.5px}
.guide .item p{color:var(--ink-2);font-size:13.5px}
.empty{color:var(--ink-3);font-size:13.5px}
pre.list{
  background:var(--plaster);border:1px solid var(--line);border-radius:11px;padding:12px;
  font-family:var(--f-mono);font-size:11.5px;line-height:1.8;white-space:pre-wrap;direction:rtl;margin:0 0 10px;
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="app">
  <div class="headwrap">
    <div class="brand">
      <h1>ألوان البيت</h1>
      <span>دليل دهان الجدران</span>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="rooms" aria-selected="true">الغرف</button>
      <button role="tab" data-tab="colors" aria-selected="false">الألوان</button>
      <button role="tab" data-tab="tools" aria-selected="false">أدوات</button>
      <button role="tab" data-tab="plan" aria-selected="false">خطتي</button>
    </nav>
  </div>
</header>

<main>
  <section id="tab-rooms"></section>
  <section id="tab-colors" hidden></section>
  <section id="tab-tools" hidden></section>
  <section id="tab-plan" hidden></section>
</main>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheetbar">
    <button class="x" id="sheet-close" aria-label="إغلاق">✕</button>
    <strong id="sheet-title"></strong>
  </div>
  <div class="sheetbody" id="sheet-body"></div>
</div>

<script>
/* ========== البيانات ========== */

const esc = s => String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

function luminance(hex){
  const v = parseInt(hex,16);
  const ch = n => { const c = n/255; return c <= .03928 ? c/12.92 : Math.pow((c+.055)/1.055, 2.4); };
  return .2126*ch((v>>16)&255) + .7152*ch((v>>8)&255) + .0722*ch(v&255);
}
const inkOn = hex => luminance(hex) > .55 ? "rgba(0,0,0,.72)" : "rgba(255,255,255,.9)";

function toLab(r,g,b){
  const f0 = n => { const c = n/255; return c <= .04045 ? c/12.92 : Math.pow((c+.055)/1.055, 2.4); };
  const R=f0(r), G=f0(g), B=f0(b);
  const x=(.4124*R+.3576*G+.1805*B)/.95047, y=.2126*R+.7152*G+.0722*B, z=(.0193*R+.1192*G+.9505*B)/1.08883;
  const f = t => t > .008856 ? Math.cbrt(t) : 7.787*t + 16/116;
  const fx=f(x), fy=f(y), fz=f(z);
  return [116*fy-16, 500*(fx-fy), 200*(fy-fz)];
}
const labOfHex = hex => { const v=parseInt(hex,16); return toLab((v>>16)&255,(v>>8)&255,v&255); };
const dE = (a,b) => Math.hypot(a[0]-b[0], a[1]-b[1], a[2]-b[2]);

}

  return sceneHTML(c, roomId, light, "preview") +
  `<div class="lightbar">
    ${Object.keys(LIGHTS).map(k => `<button data-light="${k}" aria-pressed="${k===light}">${LIGHTS[k][0]}</button>`).join("")}
  </div>`;
}

/* ========== تبويب الغرف ========== */
function renderRooms(){
  const el = document.getElementById("tab-rooms");
  el.innerHTML = `<p class="lede">اختر مكاناً في البيت وسترى الألوان المناسبة له — ليش تناسبه، ووين بالضبط تستخدمه.</p>
  <div class="rooms">${DATA.rooms.map(r => {
    const pool = DATA.colors.filter(c => c.rooms.includes(r.id));
    const chosen = byId(store.plan[r.id]);
    // بلا اختيار: نعرض الغرفة بلونها الأبرز، وتحتها مدى ألوانها من الغامق للفاتح
    const ranked = [...pool].sort((a,b) => luminance(a.hex) - luminance(b.hex));
    const hero = chosen || ranked[Math.floor(ranked.length/2)];
    const band = [ranked[0], ranked[Math.floor(ranked.length/4)], ranked[Math.floor(ranked.length/2)],
                  ranked[Math.floor(ranked.length*3/4)], ranked[ranked.length-1]].filter(Boolean);
    return `<button class="roomtile" data-room="${r.id}">
      ${sceneHTML(hero, r.id, "day")}
      <span class="meta">
        <strong>${esc(r.title)}</strong>
        <small><i style="background:#${hero.hex}"></i>${chosen ? "اخترت " + esc(hero.name) : esc(hero.name)}</small>
        <span class="swatches">${band.map(c => `<i style="background:#${c.hex}"></i>`).join("")}</span>
      </span>
    </button>`;
  }).join("")}</div>`;
}

let roomFilter = null;
function renderRoom(roomId){
  const r = roomById(roomId);
  const el = document.getElementById("tab-rooms");
  const list = DATA.colors.filter(c => c.rooms.includes(roomId) && (!roomFilter || c.family === roomFilter));
  const fams = [...new Set(DATA.colors.filter(c => c.rooms.includes(roomId)).map(c => c.family))];
  const chosen = byId(store.plan[roomId]);
  el.innerHTML = `
    <button class="btn ghost" data-back="1" style="width:auto;padding:7px 14px;font-size:13px;margin-bottom:16px">‹ كل الغرف</button>
    <h2 style="font-size:23px;margin-bottom:12px">${esc(r.title)}</h2>
    <div class="panel"><div class="info">
      <div><strong>حق شنو هذي الغرفة؟</strong><p>${esc(r.goal)}</p></div>
      <div><strong>نصيحة</strong><p>${esc(r.tip)}</p></div>
    </div></div>
    ${chosen ? `<p class="count">لونك المعتمد</p><div class="rows">${rowHTML(chosen)}</div>` : ""}
    <div class="chips" style="margin-top:18px">
      <button data-fam="" aria-pressed="${!roomFilter}">الكل</button>
      ${fams.map(f => `<button data-fam="${f}" aria-pressed="${roomFilter===f}">${FAMILY[f]}</button>`).join("")}
    </div>
    <p class="count">${list.length} لون يناسب ${esc(r.title)}</p>
    <div class="rows">${list.map(c => rowHTML(c, store.plan[roomId]===c.id ? "معتمد" : "")).join("")}</div>`;
  el.dataset.room = roomId;
}

/* ========== تبويب الألوان ========== */
let q = "", colorFilter = null;
function renderColors(){
  const el = document.getElementById("tab-colors");
  const needle = q.trim();
  const list = DATA.colors.filter(c => {
    const okF = !colorFilter || c.family === colorFilter;
    const okQ = !needle || [c.name, c.id, c.usage, c.purpose, FAMILY[c.family]].some(t => t.includes(needle));
    return okF && okQ;
  });
  el.innerHTML = `
    <input class="search" id="q" type="search" placeholder="ابحث باسم اللون أو المكان" value="${esc(q)}">
    <div class="chips">
      <button data-cfam="" aria-pressed="${!colorFilter}">الكل</button>
      ${Object.keys(FAMILY).map(f => `<button data-cfam="${f}" aria-pressed="${colorFilter===f}">${FAMILY[f]}</button>`).join("")}
    </div>
    <p class="count">${list.length} لون</p>
    <div class="rows">${list.map(c => rowHTML(c)).join("") || '<p class="empty">ما فيه لون بهذا الوصف. جرّب كلمة أخرى مثل «مطبخ» أو «هادئ».</p>'}</div>`;
}

/* ========== تبويب خطتي ========== */
function shoppingList(){
  const lines = ["قائمة ألوان البيت:"];
  DATA.rooms.forEach(r => {
    const c = byId(store.plan[r.id]);
    if (c) lines.push(`• ${r.title}: ${c.name} — ${c.id} — #${c.hex} — ${FINISH[c.finish][0]}`);
  });
  return lines.join("\n");
}
function renderPlan(){
  const el = document.getElementById("tab-plan");
  const planned = DATA.rooms.map(r => [r, byId(store.plan[r.id])]).filter(x => x[1]);
  const favs = store.favs.map(byId).filter(Boolean);
  el.innerHTML = `
    <p class="count">خطة البيت</p>
    ${planned.length ? `<div class="rows">${planned.map(([r,c]) => `<button class="row" data-color="${c.id}" data-inroom="${r.id}">
        ${chipHTML(c)}
        <span class="txt"><strong>${esc(r.title)}</strong><p>${esc(c.name)} · ${FINISH[c.finish][0]}</p></span>
      </button>`).join("")}</div>`
      : `<p class="empty">لم تعتمد أي لون بعد. افتح أي لون واضغط «اعتمده لهذه الغرفة».</p>`}

    <p class="count">المفضلة</p>
    ${favs.length ? `<div class="rows">${favs.map(c => rowHTML(c)).join("")}</div>`
      : `<p class="empty">اضغط ♡ في صفحة أي لون ليظهر هنا.</p>`}

    ${planned.length ? `<p class="count">قائمة الشراء</p>
      <div class="panel">
        <pre class="list">${esc(shoppingList())}</pre>
        <button class="btn ghost" id="copy">نسخ القائمة</button>
      </div>` : ""}`;
}

/* ========== تبويب الأدوات ========== */
let tool = null;
function renderTools(){
  const el = document.getElementById("tab-tools");
  if (tool === "calc")  return renderCalc(el);
  if (tool === "photo") return renderPhoto(el);
  if (tool === "guide") return renderGuide(el);
  el.innerHTML = `
    <p class="lede">ثلاث أدوات تختصر عليك الطريق من اختيار اللون إلى آخر وجه على الجدار.</p>
    ${[["photo","لون من صورة","صوّر جداراً أو قماشاً، اضغط على الصورة، واعرف أقرب لون عندنا إليه."],
       ["calc","حاسبة كمية الدهان","أدخل أبعاد الغرفة واعرف كم جالوناً تشتري وبكم."],
       ["guide","دليل الدهان","الأخطاء الشائعة وترتيب الخطوات من الاختيار حتى الوجه الأخير."]]
      .map(([k,t,s]) => `<div class="panel"><button class="toolcard" data-tool="${k}">
        <strong>${t}</strong><p>${s}</p></button></div>`).join("")}`;
}
function backBtn(){ return `<button class="btn ghost" data-tool="" style="width:auto;padding:7px 14px;font-size:13px;margin-bottom:16px">‹ الأدوات</button>`; }

const calc = {l:5, w:4, h:3, doors:1, windows:1, coats:2, ceiling:false, price:0};
function renderCalc(el){
  const walls = 2*(calc.l+calc.w)*calc.h + (calc.ceiling ? calc.l*calc.w : 0);
  const area = Math.max(walls - (calc.doors*1.9 + calc.windows*1.5), 0);
  const liters = area*calc.coats/10, gallons = liters/3.785, buy = Math.ceil(gallons);
  const step = (key,label,min,max,st) => `<div class="frow"><label>${label}</label>
    <span class="stepper"><button data-dec="${key}" data-step="${st}" aria-label="نقص">−</button>
    <output>${calc[key]}</output>
    <button data-inc="${key}" data-step="${st}" data-max="${max}" data-min="${min}" aria-label="زد">+</button></span></div>`;
  el.innerHTML = `${backBtn()}
    <h2 style="font-size:22px;margin-bottom:14px">حاسبة كمية الدهان</h2>
    <div class="panel"><h3>أبعاد الغرفة (متر)</h3>
      ${step("l","الطول",1,20,.5)}${step("w","العرض",1,20,.5)}${step("h","الارتفاع",2,6,.5)}
      <div class="frow"><label>أدهن السقف أيضاً</label>
        <button class="btn ghost" id="ceil" style="flex:none;padding:6px 16px;font-size:13px">${calc.ceiling ? "نعم" : "لا"}</button></div>
    </div>
    <div class="panel"><h3>ما لا يُدهن</h3>
      ${step("doors","عدد الأبواب",0,10,1)}${step("windows","عدد النوافذ",0,10,1)}${step("coats","عدد الأوجه",1,4,1)}
    </div>
    <div class="panel"><h3>النتيجة</h3>
      <div class="res"><span>المساحة المطلوب دهنها</span><span>${area.toFixed(1)} م²</span></div>
      <div class="res"><span>كمية الدهان</span><span>${liters.toFixed(1)} لتر</span></div>
      <div class="res"><span>بالجالون</span><span>${gallons.toFixed(1)}</span></div>
      <div class="res big"><span>اشترِ</span><span>${buy} جالون</span></div>
    </div>
    <div class="panel"><h3>التكلفة (اختياري)</h3>
      <div class="frow"><label>سعر الجالون</label>
        <input class="num" id="price" type="number" inputmode="decimal" value="${calc.price || ""}" placeholder="0"></div>
      ${calc.price > 0 ? `<div class="res big"><span>التكلفة التقريبية</span><span>${Math.round(buy*calc.price)}</span></div>` : ""}
    </div>
    <p class="note">الحساب مبني على تغطية ١٠ م² لكل لتر في الوجه الواحد، وهو المتوسط المكتوب على أغلب العلب. الجدار الخشن أو غير المعجون يشرب أكثر، فزد ١٥٪ احتياطاً.</p>`;
}

function renderGuide(el){
  el.innerHTML = `${backBtn()}
    <h2 style="font-size:22px;margin-bottom:14px">دليل الدهان</h2>
    ${GUIDE.map(([title, items]) => `<div class="panel guide"><h3>${title}</h3>
      ${items.map(([t,b]) => `<div class="item"><strong>${t}</strong><p>${b}</p></div>`).join("")}</div>`).join("")}
    <div class="panel guide"><h3>الدهان المناسب لكل مكان</h3>
      ${Object.keys(FINISH).map(k => `<div class="item"><strong>${FINISH[k][0]}</strong><p>${FINISH[k][1]}</p></div>`).join("")}
    </div>`;
}

let picked = null;
function renderPhoto(el){
  el.innerHTML = `${backBtn()}
    <h2 style="font-size:22px;margin-bottom:6px">لون من صورة</h2>
    <p class="note" style="margin-bottom:14px">صوّر جدارك أو قطعة قماش، ثم اضغط على المكان الذي تريد لونه.</p>
    <label class="filebtn" for="photo">اختر صورة أو التقطها بالكاميرا
      <input id="photo" type="file" accept="image/*" hidden></label>
    <div id="canvaswrap" style="margin-top:14px"></div>
    <div id="matches"></div>`;
}
function showMatches(r,g,b){
  const hex = [r,g,b].map(n => n.toString(16).padStart(2,"0")).join("").toUpperCase();
  const lab = toLab(r,g,b);
  const near = DATA.colors.map(c => [c, dE(lab, labOfHex(c.hex))]).sort((a,b) => a[1]-b[1]).slice(0,4);
  document.getElementById("matches").innerHTML = `
    <div class="panel" style="margin-top:14px;display:flex;gap:13px;align-items:center">
      <i class="chip" style="background:#${hex}"></i>
      <span class="txt"><strong>اللون الملتقط</strong><p class="mono">#${hex}</p></span>
    </div>
    <p class="count">أقرب الألوان عندنا</p>
    <div class="rows">${near.map(([c,d]) => rowHTML(c, d < 3 ? "مطابق" : d < 8 ? "قريب جداً" : "قريب")).join("")}</div>`;
}

/* ========== شاشة اللون ========== */
let sheetState = {id:null, room:null, light:"day"};
function openColor(id, roomId){
  sheetState = {id, room: roomId || byId(id).rooms[0], light:"day"};
  drawSheet();
  document.getElementById("sheet").dataset.open = "true";
  document.body.style.overflow = "hidden";
}
function closeSheet(){
  document.getElementById("sheet").dataset.open = "false";
  document.body.style.overflow = "";
  renderAll();
}
function drawSheet(){
  const c = byId(sheetState.id), r = roomById(sheetState.room);
  const fav = store.favs.includes(c.id);
  const chosen = store.plan[sheetState.room] === c.id;
  document.getElementById("sheet-title").textContent = c.name;
  document.getElementById("sheet-body").innerHTML = `
    ${previewHTML(c, sheetState.room, sheetState.light)}
    <div class="bigname"><h2>${esc(c.name)}</h2><span class="mono" style="color:var(--ink-3);font-size:12px">#${c.hex}</span></div>
    <p class="sub">${c.id} · ${FAMILY[c.family]}</p>
    <div class="panel"><div class="info">
      <div><strong>حق شنو؟</strong><p>${esc(c.purpose)}</p></div>
      <div><strong>وين استخدمه؟</strong><p>${esc(c.usage)}</p></div>
      <div><strong>مع الإضاءة</strong><p>${esc(c.lighting)}</p></div>
      <div><strong>نوع الدهان المقترح: ${FINISH[c.finish][0]}</strong><p>${FINISH[c.finish][1]}</p></div>
    </div></div>
    <div class="panel"><h3>ينسجم مع</h3>
      <div class="pairs">${c.pairs.map(h => `<div><i style="background:#${h}"></i><small>${h}</small></div>`).join("")}</div>
      <p class="note" style="margin-top:9px">استخدم هذه في الأثاث والستائر والتفاصيل، لا على الجدار نفسه.</p>
    </div>
    <div class="panel"><h3>يناسب هذه الأماكن</h3>
      <div class="tags">${c.rooms.map(x => `<span>${esc(roomById(x).title)}</span>`).join("")}</div>
    </div>
    <div class="actions">
      <button class="btn ${chosen ? "on" : ""}" id="adopt">${chosen ? `لون ${esc(r.title)} — إلغاء` : `اعتمده لـ ${esc(r.title)}`}</button>
      <button class="btn ghost" id="fav" style="flex:none;padding:13px 20px">${fav ? "♥" : "♡"}</button>
    </div>`;
}

/* ========== التنقل والأحداث ========== */
let tab = "rooms";
function renderAll(){
  ["rooms","colors","tools","plan"].forEach(t => {
    document.getElementById("tab-" + t).hidden = t !== tab;
  });
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  const el = document.getElementById("tab-rooms");
  if (tab === "rooms") el.dataset.room ? renderRoom(el.dataset.room) : renderRooms();
  if (tab === "colors") renderColors();
  if (tab === "tools") renderTools();
  if (tab === "plan") renderPlan();
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-room],[data-color],[data-back],[data-fam],[data-cfam],[data-tool],[data-light],[data-inc],[data-dec],#ceil,#copy,#adopt,#fav,#sheet-close");
  if (!t) return;

  if (t.dataset.tab){ tab = t.dataset.tab; if (tab === "rooms") delete document.getElementById("tab-rooms").dataset.room; renderAll(); window.scrollTo(0,0); return; }
  if (t.dataset.back !== undefined && t.hasAttribute("data-back")){ delete document.getElementById("tab-rooms").dataset.room; roomFilter = null; renderAll(); return; }
  if (t.dataset.color){ openColor(t.dataset.color, t.dataset.inroom || document.getElementById("tab-rooms").dataset.room); return; }
  if (t.dataset.room){ roomFilter = null; renderRoom(t.dataset.room); window.scrollTo(0,0); return; }
  if (t.hasAttribute("data-fam")){ roomFilter = t.dataset.fam || null; renderRoom(document.getElementById("tab-rooms").dataset.room); return; }
  if (t.hasAttribute("data-cfam")){ colorFilter = t.dataset.cfam || null; renderColors(); return; }
  if (t.hasAttribute("data-tool")){ tool = t.dataset.tool || null; renderTools(); window.scrollTo(0,0); return; }
  if (t.dataset.light){ sheetState.light = t.dataset.light; drawSheet(); return; }
  if (t.id === "sheet-close"){ closeSheet(); return; }
  if (t.id === "adopt"){
    if (store.plan[sheetState.room] === sheetState.id) delete store.plan[sheetState.room];
    else store.plan[sheetState.room] = sheetState.id;
    store.save(); drawSheet(); return;
  }
  if (t.id === "fav"){
    const i = store.favs.indexOf(sheetState.id);
    if (i >= 0) store.favs.splice(i,1); else store.favs.push(sheetState.id);
    store.save(); drawSheet(); return;
  }
  if (t.id === "ceil"){ calc.ceiling = !calc.ceiling; renderTools(); return; }
  if (t.id === "copy"){
    navigator.clipboard?.writeText(shoppingList()).then(() => { t.textContent = "تم النسخ ✓"; setTimeout(() => t.textContent = "نسخ القائمة", 1800); });
    return;
  }
  if (t.dataset.inc || t.dataset.dec){
    const key = t.dataset.inc || t.dataset.dec, st = parseFloat(t.dataset.step);
    const lim = t.dataset.inc ? {min:parseFloat(t.dataset.min), max:parseFloat(t.dataset.max)} : null;
    calc[key] = t.dataset.inc ? Math.min(calc[key] + st, lim.max) : Math.max(calc[key] - st, key === "coats" ? 1 : 0);
    calc[key] = Math.round(calc[key]*10)/10;
    renderTools();
  }
});

document.addEventListener("input", e => {
  if (e.target.id === "q"){ q = e.target.value; const pos = e.target.selectionStart; renderColors();
    const n = document.getElementById("q"); n.focus(); try{ n.setSelectionRange(pos,pos); }catch(err){} }
  if (e.target.id === "price"){ calc.price = parseFloat(e.target.value) || 0; const v = e.target.value; renderTools();
    const n = document.getElementById("price"); if(n){ n.focus(); n.value = v; } }
});

document.addEventListener("change", e => {
  if (e.target.id !== "photo" || !e.target.files?.[0]) return;
  const img = new Image();
  img.onload = () => {
    const wrap = document.getElementById("canvaswrap");
    const cv = document.createElement("canvas");
    const maxW = Math.min(wrap.clientWidth || 340, 700);
    const scale = Math.min(1, maxW / img.naturalWidth);
    cv.width = Math.round(img.naturalWidth*scale);
    cv.height = Math.round(img.naturalHeight*scale);
    const ctx = cv.getContext("2d", {willReadFrequently:true});
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    wrap.innerHTML = "";
    wrap.appendChild(cv);
    cv.addEventListener("click", ev => {
      const b = cv.getBoundingClientRect();
      const x = Math.round((ev.clientX - b.left) * cv.width / b.width);
      const y = Math.round((ev.clientY - b.top) * cv.height / b.height);
      const rad = 3, x0 = Math.max(0, x-rad), y0 = Math.max(0, y-rad);
      const w = Math.min(cv.width - x0, rad*2+1), h = Math.min(cv.height - y0, rad*2+1);
      const d = ctx.getImageData(x0, y0, w, h).data;
      let R=0, G=0, B=0;
      for (let i = 0; i < d.length; i += 4){ R += d[i]; G += d[i+1]; B += d[i+2]; }
      const n = d.length/4;
      showMatches(Math.round(R/n), Math.round(G/n), Math.round(B/n));
    });
    URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(e.target.files[0]);
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && document.getElementById("sheet").dataset.open === "true") closeSheet();
});

renderAll();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
