<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>سجل الحضور — نظام الحضور</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>نظام تسجيل الحضور والغياب</h1>
    <nav>
      <a href="index.html">الطلاب</a>
      <a href="attendance.html">تسجيل الحضور</a>
      <a href="history.html">السجل</a>
      <a href="stats.html">الإحصائيات</a>
    </nav>
  </header>
  <main>
    <section class="card">
      <h2>تصفية السجل</h2>
      <div class="row">
        <div>
          <label for="f-date">التاريخ</label>
          <input id="f-date" type="date">
        </div>
        <div>
          <label for="f-name">اسم الطالب</label>
          <input id="f-name" type="text" placeholder="اكتب جزءاً من الاسم" autocomplete="off">
        </div>
        <div>
          <label for="f-status">الحالة</label>
          <select id="f-status">
            <option value="">الكل</option>
            <option value="present">حاضر</option>
            <option value="absent">غائب</option>
          </select>
        </div>
        <div style="align-self:flex-end;flex:0 0 auto">
          <button class="ghost" id="reset" type="button">إعادة تعيين</button>
        </div>
      </div>
    </section>

    <div id="results"></div>
  </main>

  <script src="app.js"></script>
  <script>
    const fDate = document.getElementById('f-date');
    const fName = document.getElementById('f-name');
    const fStatus = document.getElementById('f-status');
    const resultsEl = document.getElementById('results');

    function render() {
      const rec = DB.records();
      const nameQuery = fName.value.trim();
      let dates = Object.keys(rec).sort().reverse();
      if (fDate.value) dates = dates.filter(d => d === fDate.value);

      resultsEl.innerHTML = '';
      let shown = 0;

      dates.forEach(date => {
        let entries = Object.keys(rec[date]).map(id => ({
          id: id,
          name: studentName(id),
          status: rec[date][id]
        }));
        if (nameQuery) entries = entries.filter(e => e.name.includes(nameQuery));
        if (fStatus.value) entries = entries.filter(e => e.status === fStatus.value);
        if (!entries.length) return;

        entries.sort((a, b) => a.name.localeCompare(b.name, 'ar'));
        shown += entries.length;

        const present = entries.filter(e => e.status === 'present').length;
        const card = document.createElement('section');
        card.className = 'card';

        const h = document.createElement('h2');
        h.textContent = formatDate(date);
        const sub = document.createElement('p');
        sub.className = 'muted';
        sub.style.margin = '-8px 0 8px';
        sub.textContent = 'الحاضرون: ' + present + ' • الغائبون: ' + (entries.length - present);

        const ul = document.createElement('ul');
        ul.className = 'list';
        entries.forEach(e => {
          const li = document.createElement('li');
          const n = document.createElement('span');
          n.className = 'name';
          n.textContent = e.name;
          const badge = document.createElement('span');
          badge.className = 'badge ' + e.status;
          badge.textContent = e.status === 'present' ? 'حاضر' : 'غائب';
          li.append(n, badge);
          ul.appendChild(li);
        });

        card.append(h, sub, ul);
        resultsEl.appendChild(card);
      });

      if (!shown) {
        resultsEl.innerHTML = '<section class="card"><p class="empty">لا توجد سجلات مطابقة.</p></section>';
      }
    }

    [fDate, fName, fStatus].forEach(el => el.addEventListener('input', render));
    document.getElementById('reset').onclick = () => {
      fDate.value = ''; fName.value = ''; fStatus.value = '';
      render();
    };
    render();
  </script>
</body>
</html>
