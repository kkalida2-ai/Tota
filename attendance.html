<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الحضور — نظام الحضور</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>نظام تسجيل الحضور والغياب</h1>
    <nav>
      <a href="index.html">الطلاب</a>
      <a href="attendance.html">تسجيل الحضور</a>
      <a href="history.html">السجل</a>
      <a href="stats.html">الإحصائيات</a>
    </nav>
  </header>
  <main>
    <section class="card">
      <h2>تسجيل حضور اليوم</h2>
      <div class="row">
        <div>
          <label for="date">التاريخ</label>
          <input id="date" type="date">
        </div>
        <div style="align-self:flex-end;display:flex;gap:8px">
          <button class="ghost" id="all-present" type="button">الكل حاضر</button>
          <button class="ghost" id="all-absent" type="button">الكل غائب</button>
        </div>
      </div>
      <p class="muted" id="summary" style="margin:12px 0 0"></p>
    </section>

    <section class="card">
      <ul id="rows" class="list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    const dateEl = document.getElementById('date');
    const rowsEl = document.getElementById('rows');
    const summaryEl = document.getElementById('summary');
    dateEl.value = today();

    function render() {
      const date = dateEl.value || today();
      const students = DB.students();
      const day = DB.records()[date] || {};

      if (!students.length) {
        rowsEl.innerHTML = '<li class="empty">لا يوجد طلاب. أضف الطلاب من صفحة «الطلاب» أولاً.</li>';
        summaryEl.textContent = '';
        return;
      }

      rowsEl.innerHTML = '';
      students.forEach(s => {
        const li = document.createElement('li');
        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = s.name;

        const group = document.createElement('div');
        group.className = 'toggle';
        [['present', 'حاضر'], ['absent', 'غائب']].forEach(([status, label]) => {
          const b = document.createElement('button');
          b.type = 'button';
          b.textContent = label;
          if (day[s.id] === status) b.classList.add(status === 'present' ? 'on-present' : 'on-absent');
          b.onclick = () => {
            DB.setStatus(date, s.id, status);
            render();
          };
          group.appendChild(b);
        });

        li.append(name, group);
        rowsEl.appendChild(li);
      });

      const marked = students.filter(s => day[s.id]).length;
      const present = students.filter(s => day[s.id] === 'present').length;
      summaryEl.textContent = 'تم تسجيل ' + marked + ' من ' + students.length +
        ' طالب — الحاضرون: ' + present + ' • الغائبون: ' + (marked - present);
    }

    function markAll(status) {
      const date = dateEl.value || today();
      DB.students().forEach(s => DB.setStatus(date, s.id, status));
      render();
      toast(status === 'present' ? 'تم تعليم الجميع حاضرين' : 'تم تعليم الجميع غائبين');
    }

    dateEl.addEventListener('change', render);
    document.getElementById('all-present').onclick = () => markAll('present');
    document.getElementById('all-absent').onclick = () => markAll('absent');
    render();
  </script>
</body>
</html>
